# YOLOv8 / YOLO11 Waste Dataset Configuration
# Place your dataset images and labels in train and val folders:
path: ./waste_dataset # root dataset dir
train: images/train   # train images (relative to 'path')
val: images/val       # val images (relative to 'path')
test: images/test     # test images (optional)

# Classes aligned with the EcoSort Waste Monitoring taxonomy:
names:
  0: plastic
  1: glass
  2: metal
  3: paper
  4: cardboard
  5: organic
  6: hazardous
